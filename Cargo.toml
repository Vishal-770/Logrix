[workspace]
resolver = "2"
members = [
    "crates/logrix-core",
    "crates/logrix-resilience",
    "crates/logrix-testkit",
    "crates/logrix-store-postgres",
    "crates/logrix-queue-rabbitmq",
    "crates/logrix-chain-evm",
    "crates/logrix-api",
    "crates/logrix-cli",
    "crates/logrix-queue-sqs",
    "crates/logrix-rpc-gateway",
    "crates/logrix-reconciler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Logrix Contributors"]
license = "Apache-2.0"
repository = "https://github.com/logrix/logrix"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1.86"
futures = "0.3.31"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

# Ethereum Primitives
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-dyn-abi = { version = "0.8" }

# Utilities
rand = "0.8"

# Error Handling & Observability
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database & SQL
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }

# Message Queue
lapin = "2.5"

# Networking & API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
async-graphql = { version = "7.0", features = ["chrono", "uuid"] }
async-graphql-axum = "7.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Internal workspace crates
logrix-core = { path = "crates/logrix-core" }
logrix-resilience = { path = "crates/logrix-resilience" }
logrix-testkit = { path = "crates/logrix-testkit" }
logrix-store-postgres = { path = "crates/logrix-store-postgres" }
logrix-queue-rabbitmq = { path = "crates/logrix-queue-rabbitmq" }
logrix-chain-evm = { path = "crates/logrix-chain-evm" }
logrix-api = { path = "crates/logrix-api" }
logrix-cli = { path = "crates/logrix-cli" }
logrix-queue-sqs = { path = "crates/logrix-queue-sqs" }
logrix-rpc-gateway = { path = "crates/logrix-rpc-gateway" }
logrix-reconciler = { path = "crates/logrix-reconciler" }
