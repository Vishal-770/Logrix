name: Release & Publish Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm-chart:
    name: Package & Push Helm Chart (OCI)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR for Helm OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package & Push Helm Chart
        run: |
          # Extract clean version tag (remove leading v)
          RAW_VERSION="${{ github.ref_name }}"
          CHART_VERSION="${RAW_VERSION#v}"
          if [ -z "$CHART_VERSION" ] || [ "$CHART_VERSION" = "main" ]; then
            CHART_VERSION="0.1.0"
          fi

          # Update chart version dynamically
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" deploy/helm/logrix/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: "${CHART_VERSION}"/" deploy/helm/logrix/Chart.yaml

          helm package deploy/helm/logrix --destination ./packaged-chart
          PKG_NAME=$(ls ./packaged-chart/logrix-*.tgz)
          helm push "${PKG_NAME}" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
