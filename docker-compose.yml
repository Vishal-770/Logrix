version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: logrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logrix}
      POSTGRES_DB: ${POSTGRES_DB:-logrix}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logrix} -d ${POSTGRES_DB:-logrix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: logrix-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-logrix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-logrix}
    ports:
      - "5672:5672"    # AMQP broker protocol
      - "15672:15672"  # Web Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: logrix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-logrix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-logrixpassword}
    ports:
      - "9000:9000"  # S3 API endpoint
      - "9001:9001"  # MinIO Web Console UI
    volumes:
      - minio_data:/data

  localstack:
    image: localstack/localstack:3.2
    container_name: logrix-localstack
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - AWS_DEFAULT_REGION=us-east-1

volumes:
  pg_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
