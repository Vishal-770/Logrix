specVersion: 0.1.0
network:
  name: arbitrum-one
  chainId: 42161
  rpcUrl: https://arb-mainnet.g.alchemy.com/v2/Fc1p2d1g6C3jJ_JEM9Qqo
  fallbackRpcUrls:
    - https://arb-mainnet.g.alchemy.com/v2/alch_Hv124VlaLZqOSH12K-5KL
    - https://arb1.arbitrum.io/rpc
dataSources:
  - kind: ethereum/contract
    name: UniswapV3Pool
    network: arbitrum-one
    source:
      address: "0xC6962004f452bE9203591991D15f6b388e09E8D0"
      abi: UniswapV3Pool
      startBlock: 514022000
    mapping:
      kind: wasm/assemblyscript
      file: ./build/mapping.wasm
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Swap(address indexed,address indexed,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,address indexed,int24 indexed,int24 indexed,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(address indexed,int24 indexed,int24 indexed,uint128,uint256,uint256)
          handler: handleBurn
indexing:
  ringBufferDepth: 128
  reconcilerIntervalSecs: 30
