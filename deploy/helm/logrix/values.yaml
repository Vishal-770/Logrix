# Default values for logrix.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

image:
  repository: ghcr.io/vishal-770/logrix
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

config:
  chainId: 421614
  contractAddress: "0x75faf114eafb1BDbe2F0316DF893fd58CE46AA4d"
  rpcUrl: "https://sepolia-rollup.arbitrum.io/rpc"
  rpcFallbackUrls: ""
  queueDriver: "rabbitmq"
  rabbitmqUrl: ""
  sqsLiveUrl: ""
  sqsBackfillUrl: ""
  sqsWebhookUrl: ""
  sqsDlqUrl: ""
  sqsEndpoint: ""
  awsRegion: "us-east-1"
  databaseUrl: ""
  databaseMaxConnections: 10
  databaseMinConnections: 2
  databaseStatementTimeoutSecs: 30
  maxQueueDepth: 1000
  s3Endpoint: ""
  s3Bucket: ""
  s3Prefix: ""
  startBlock: ""
  chunkSize: 10
  cuBudget: ""
  bulkStreamUrl: ""
  webhookUrl: ""
  webhookSecret: ""
  reconcilerIntervalSecs: 30
  ringBufferDepth: 128
  # Extended runtime tuning & resilience parameters
  reconcilerChunkSize: 10
  reconcilerLagThreshold: 50
  chainHeadPollMs: 1500
  rabbitmqPrefetch: 100
  rabbitmqTimeoutSecs: 10
  sqsWaitTimeSeconds: 2
  sqsMaxMessages: 1
  wasmFuelLimit: 1000000
  wasmMaxMemoryMb: 128
  rpcTimeoutSecs: 10
  rpcCbThreshold: 5
  rpcCooldownSecs: 30
  webhookTimeoutSecs: 5
  webhookMaxRetries: 1
  webhookWorkerIdleMs: 100
  webhookWorkerBackoffMs: 500
  graphqlMaxDepth: 7
  graphqlMaxComplexity: 200
  graphqlDefaultLimit: 100
  graphqlMaxLimit: 1000
  graphqlQueryTimeoutSecs: 5
  manifestPath: ""
  schemaPath: ""
  # Inline manifest.yaml content for pure Kubernetes / zero-code deployments
  manifestContent: ""
  # Inline schema.graphql content for dynamic entities
  schemaContent: ""
  # Raw WebAssembly binary content (passed directly via --set-file config.wasmBinary=handlers/mapping.wasm)
  wasmBinary: ""
  # Or pre-encoded base64 WebAssembly string
  wasmBase64: ""
  # Existing Kubernetes Secret providing runtime credentials. Expected keys include
  # DATABASE_URL, RABBITMQ_URL, and WEBHOOK_SECRET when those features are enabled.
  existingSecret: "logrix-secrets"

# Built-in self-hosted backing infrastructure (PostgreSQL, RabbitMQ, and MinIO S3)
# Disabled by default for cloud-native production deployments (AWS Aurora, SQS, S3).
# Enable only if running on local clusters (Minikube / Kind) without external databases.
builtIn:
  enabled: false
  postgres: false
  rabbitmq: false
  minio: false
  persistence:
    enabled: false
  storageClass: ""
  postgresStorage: 1Gi
  rabbitmqStorage: 1Gi
  minioStorage: 5Gi
  postgresPassword: ""
  rabbitmqPassword: ""
  minioRootUser: "logrix"
  minioRootPassword: ""

# Backward-compatibility alias
localDev:
  enabled: false

ingester:
  enabled: true
  replicas: 2
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  leaderElection:
    enabled: true
    leaseName: "logrix-ingester-lease"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: ingester
            topologyKey: kubernetes.io/hostname

processor:
  enabled: true
  replicas: 1
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 50
    cooldownPeriod: 300
    pollingInterval: 15
    targetQueueDepth: 30
    queueType: rabbitmq
    rabbitmq:
      queueName: "logrix.live.jobs"
      host: ""
    sqs:
      queueUrl: ""
      awsRegion: "us-east-1"
    triggerAuthentication:
      enabled: true
      name: ""
      podIdentityProvider: "aws"
      identityOwner: "workload"
    rabbitmqTriggerAuthentication:
      enabled: true
      name: ""
  webhookWorker:
    enabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  terminationGracePeriodSeconds: 60

api:
  enabled: true
  replicas: 2
  port: 4000
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 4000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: logrix.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

serviceAccount:
  create: true
  annotations: {}
  name: "logrix-sa"

rbac:
  create: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

webhook:
  enabled: false
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 0
    maxReplicas: 10
    targetQueueDepth: 50
    awsRegion: "us-east-1"
    triggerAuthentication:
      enabled: true
      name: ""
      podIdentityProvider: "aws"
      identityOwner: "workload"
    rabbitmqTriggerAuthentication:
      enabled: true
      name: ""

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

networkPolicy:
  enabled: false
