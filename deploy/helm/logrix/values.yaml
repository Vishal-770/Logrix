# Default values for logrix.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

image:
  repository: ghcr.io/vishal-770/logrix
  pullPolicy: IfNotPresent
  tag: "latest"

config:
  chainId: 421614
  contractAddress: "0x75faf114eafb1BDbe2F0316DF893fd58CE46AA4d"
  rpcUrl: "https://sepolia-rollup.arbitrum.io/rpc"
  rpcFallbackUrls: ""
  queueDriver: "rabbitmq"
  rabbitmqUrl: ""
  sqsLiveUrl: ""
  sqsBackfillUrl: ""
  sqsWebhookUrl: ""
  sqsDlqUrl: ""
  sqsEndpoint: ""
  databaseUrl: ""
  databaseMaxConnections: 10
  databaseMinConnections: 2
  maxQueueDepth: 1000
  s3Endpoint: ""
  startBlock: ""
  cuBudget: ""
  bulkStreamUrl: ""
  webhookUrl: ""
  reconcilerIntervalSecs: 30
  ringBufferDepth: 128
  manifestPath: ""
  schemaPath: ""
  # Inline manifest.yaml content for pure Kubernetes / zero-code deployments
  manifestContent: ""
  # Inline schema.graphql content for dynamic entities
  schemaContent: ""
  # Raw WebAssembly binary content (passed directly via --set-file config.wasmBinary=handlers/mapping.wasm)
  wasmBinary: ""
  # Or pre-encoded base64 WebAssembly string
  wasmBase64: ""
  # Optional existing Kubernetes secret name providing DATABASE_URL and RABBITMQ_URL
  existingSecret: ""

# Mode 1: Built-in self-hosted backing infrastructure (PostgreSQL, RabbitMQ, and MinIO S3)
# Enabled by default for zero-configuration out-of-the-box self-hosted deployment.
# Any service is automatically disabled if you specify an external endpoint (e.g. databaseUrl or queueDriver: sqs).
builtIn:
  enabled: true
  postgres: true
  rabbitmq: true
  minio: false
  postgresStorage: 1Gi
  rabbitmqStorage: 1Gi
  minioStorage: 5Gi

# Backward-compatibility alias
localDev:
  enabled: false

ingester:
  enabled: true
  replicas: 2
  leaderElection:
    enabled: true
    leaseName: "logrix-ingester-lease"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: ingester
            topologyKey: kubernetes.io/hostname

processor:
  enabled: true
  replicas: 1
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 50
    cooldownPeriod: 300
    pollingInterval: 15
    targetQueueDepth: 30
    queueType: rabbitmq
    rabbitmq:
      queueName: "logrix.live.jobs"
      host: "amqp://logrix:logrix@rabbitmq:5672/%2f"
    sqs:
      queueUrl: ""
      awsRegion: "us-east-1"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  terminationGracePeriodSeconds: 60

api:
  enabled: true
  replicas: 2
  port: 4000
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 4000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: logrix.local
        paths:
          - path: /
            pathType: ImplementationSpecific

serviceAccount:
  create: true
  annotations: {}
  name: "logrix-sa"

rbac:
  create: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

webhook:
  enabled: false
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 0
    maxReplicas: 10
    targetQueueDepth: 50

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

