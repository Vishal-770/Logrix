{{- if and .Values.webhook.enabled .Values.webhook.autoscaling.enabled }}
{{- $sqsQueueURL := .Values.config.sqsWebhookUrl }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "logrix.fullname" . }}-webhook-autoscaler
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "logrix.fullname" . }}-webhook
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: {{ .Values.webhook.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.webhook.autoscaling.maxReplicas }}
  triggers:
    {{- if or (eq .Values.config.queueDriver "sqs") .Values.config.sqsWebhookUrl }}
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ required "config.sqsWebhookUrl is required for webhook SQS scaling" $sqsQueueURL | quote }}
        queueLength: {{ .Values.webhook.autoscaling.targetQueueDepth | default 50 | quote }}
        awsRegion: {{ default .Values.config.awsRegion .Values.webhook.autoscaling.awsRegion | default "us-east-1" | quote }}
      {{- if .Values.webhook.autoscaling.triggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.webhookSqsTriggerAuthenticationName" . }}
      {{- end }}
    {{- else }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: "logrix.blocks.webhook"
        mode: QueueLength
        value: {{ .Values.webhook.autoscaling.targetQueueDepth | quote }}
        {{- if .Values.webhook.autoscaling.rabbitmqTriggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.webhookRabbitmqTriggerAuthenticationName" . }}
        {{- else }}
        host: {{ required "config.rabbitmqUrl is required when webhook RabbitMQ TriggerAuthentication is disabled" .Values.config.rabbitmqUrl | quote }}
        {{- end }}
{{- end }}
{{- end }}
