{{- if and .Values.webhook.enabled .Values.webhook.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "logrix.fullname" . }}-webhook-autoscaler
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "logrix.fullname" . }}-webhook
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: {{ .Values.webhook.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.webhook.autoscaling.maxReplicas }}
  triggers:
    {{- if or (eq .Values.config.queueDriver "sqs") .Values.config.sqsWebhookUrl }}
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ .Values.config.sqsWebhookUrl | quote }}
        queueLength: {{ .Values.webhook.autoscaling.targetQueueDepth | default 50 | quote }}
        awsRegion: {{ .Values.webhook.autoscaling.awsRegion | default "us-east-1" | quote }}
        identityOwner: operator
    {{- else }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: "logrix.blocks.webhook"
        mode: QueueLength
        value: {{ .Values.webhook.autoscaling.targetQueueDepth | quote }}
        host: {{ default (printf "amqp://logrix:logrixpassword@%s-rabbitmq:5672/%%2f" (include "logrix.fullname" .)) .Values.config.rabbitmqUrl | quote }}
    {{- end }}
{{- end }}
