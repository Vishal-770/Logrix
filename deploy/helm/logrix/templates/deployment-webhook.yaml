{{- if .Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logrix.fullname" . }}-webhook
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicaCount }}
  selector:
    matchLabels:
      {{- include "logrix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "logrix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "logrix.webhookServiceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.webhook.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: webhook
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["logrix", "webhook-dispatcher"]
          envFrom:
            - configMapRef:
                name: {{ include "logrix.fullname" . }}-config
            - secretRef:
                name: {{ include "logrix.credentialsSecretName" . }}
            {{- if and .Values.config.existingSecret (or .Values.builtIn.enabled .Values.config.webhookSecret) }}
            - secretRef:
                name: {{ include "logrix.internalSecretName" . }}
            {{- end }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f logrix || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f logrix || exit 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          volumeMounts:
            - name: logrix-tmp
              mountPath: /tmp
            {{- if or .Values.config.manifestContent .Values.config.schemaContent }}
            - name: logrix-config-volume
              mountPath: /etc/logrix
            {{- end }}
      volumes:
        - name: logrix-tmp
          emptyDir: {}
        {{- if or .Values.config.manifestContent .Values.config.schemaContent }}
        - name: logrix-config-volume
          configMap:
            name: {{ include "logrix.fullname" . }}-config
            items:
              {{- if .Values.config.manifestContent }}
              - key: manifest.yaml
                path: manifest.yaml
              {{- end }}
              {{- if .Values.config.schemaContent }}
              - key: schema.graphql
                path: schema.graphql
              {{- end }}
        {{- end }}
{{- end }}
