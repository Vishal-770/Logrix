{{- if .Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logrix.fullname" . }}-webhook
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicaCount }}
  selector:
    matchLabels:
      {{- include "logrix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        {{- include "logrix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: {{ include "logrix.serviceAccountName" . }}
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["logrix", "webhook-dispatcher"]
          envFrom:
            - configMapRef:
                name: {{ include "logrix.fullname" . }}-config
            {{- if .Values.config.existingSecret }}
            - secretRef:
                name: {{ .Values.config.existingSecret }}
            {{- end }}
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          volumeMounts:
            {{- if or .Values.config.manifestContent .Values.config.schemaContent }}
            - name: logrix-config-volume
              mountPath: /etc/logrix
            {{- end }}
      volumes:
        {{- if or .Values.config.manifestContent .Values.config.schemaContent }}
        - name: logrix-config-volume
          configMap:
            name: {{ include "logrix.fullname" . }}-config
            items:
              {{- if .Values.config.manifestContent }}
              - key: manifest.yaml
                path: manifest.yaml
              {{- end }}
              {{- if .Values.config.schemaContent }}
              - key: schema.graphql
                path: schema.graphql
              {{- end }}
        {{- end }}
{{- end }}
