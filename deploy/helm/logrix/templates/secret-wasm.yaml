{{- if or .Values.config.wasmBinary .Values.config.wasmBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logrix.fullname" . }}-wasm
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.config.wasmBinary }}
data:
  mapping.wasm: {{ .Values.config.wasmBinary | b64enc | quote }}
{{- else if .Values.config.wasmBase64 }}
binaryData:
  mapping.wasm: {{ .Values.config.wasmBase64 | quote }}
{{- end }}
{{- end }}
