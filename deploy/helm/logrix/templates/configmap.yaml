apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logrix.fullname" . }}-config
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
data:
  CHAIN_ID: {{ .Values.config.chainId | default 421614 | quote }}
  CONTRACT_ADDRESS: {{ required "config.contractAddress must not be empty" .Values.config.contractAddress | quote }}
  RPC_URL: {{ required "config.rpcUrl must not be empty" .Values.config.rpcUrl | quote }}
  RPC_FALLBACK_URLS: {{ .Values.config.rpcFallbackUrls | default "" | quote }}
  QUEUE_DRIVER: {{ .Values.config.queueDriver | default "rabbitmq" | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | default "us-east-1" | quote }}
  DATABASE_MAX_CONNECTIONS: {{ .Values.config.databaseMaxConnections | default 10 | quote }}
  DATABASE_MIN_CONNECTIONS: {{ .Values.config.databaseMinConnections | default 2 | quote }}
  DATABASE_STATEMENT_TIMEOUT_SECS: {{ .Values.config.databaseStatementTimeoutSecs | default 30 | quote }}
  MAX_QUEUE_DEPTH: {{ .Values.config.maxQueueDepth | default 1000 | quote }}
  {{- if or (and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.minio) .Values.config.s3Bucket }}
  S3_BUCKET: {{ default "logrix-blocks" .Values.config.s3Bucket | quote }}
  S3_PREFIX: {{ .Values.config.s3Prefix | default "" | quote }}
  {{- if .Values.config.s3Endpoint }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  {{- else if and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.minio }}
  S3_ENDPOINT: {{ printf "http://%s-minio:9000" (include "logrix.fullname" .) | quote }}
  {{- end }}
  {{- end }}
  {{- if or (eq .Values.config.queueDriver "sqs") .Values.config.sqsLiveUrl }}
  SQS_LIVE_URL: {{ .Values.config.sqsLiveUrl | default "" | quote }}
  SQS_BACKFILL_URL: {{ .Values.config.sqsBackfillUrl | default "" | quote }}
  SQS_WEBHOOK_URL: {{ .Values.config.sqsWebhookUrl | default "" | quote }}
  SQS_DLQ_URL: {{ .Values.config.sqsDlqUrl | default "" | quote }}
  {{- if .Values.config.sqsEndpoint }}
  SQS_ENDPOINT: {{ .Values.config.sqsEndpoint | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.processor .Values.processor.webhookWorker .Values.processor.webhookWorker.enabled }}
  ENABLE_WEBHOOKS: "true"
  {{- end }}
  RECONCILER_INTERVAL_SECS: {{ .Values.config.reconcilerIntervalSecs | default 30 | quote }}
  RING_BUFFER_DEPTH: {{ .Values.config.ringBufferDepth | default 128 | quote }}
  {{- if .Values.config.reconcilerChunkSize }}
  RECONCILER_CHUNK_SIZE: {{ .Values.config.reconcilerChunkSize | quote }}
  {{- end }}
  RECONCILER_LAG_THRESHOLD: {{ .Values.config.reconcilerLagThreshold | default 50 | quote }}
  CHAIN_HEAD_POLL_MS: {{ .Values.config.chainHeadPollMs | default 1500 | quote }}
  RABBITMQ_PREFETCH: {{ .Values.config.rabbitmqPrefetch | default 100 | quote }}
  RABBITMQ_TIMEOUT_SECS: {{ .Values.config.rabbitmqTimeoutSecs | default 10 | quote }}
  SQS_WAIT_TIME_SECONDS: {{ .Values.config.sqsWaitTimeSeconds | default 2 | quote }}
  SQS_MAX_MESSAGES: {{ .Values.config.sqsMaxMessages | default 1 | quote }}
  WASM_FUEL_LIMIT: {{ printf "%.0f" (float64 (.Values.config.wasmFuelLimit | default 1000000)) | quote }}
  WASM_MAX_MEMORY_MB: {{ .Values.config.wasmMaxMemoryMb | default 128 | quote }}
  RPC_TIMEOUT_SECS: {{ .Values.config.rpcTimeoutSecs | default 10 | quote }}
  RPC_CB_THRESHOLD: {{ .Values.config.rpcCbThreshold | default 5 | quote }}
  RPC_COOLDOWN_SECS: {{ .Values.config.rpcCooldownSecs | default 30 | quote }}
  WEBHOOK_TIMEOUT_SECS: {{ .Values.config.webhookTimeoutSecs | default 5 | quote }}
  WEBHOOK_MAX_RETRIES: {{ .Values.config.webhookMaxRetries | default 1 | quote }}
  WEBHOOK_WORKER_IDLE_MS: {{ .Values.config.webhookWorkerIdleMs | default 100 | quote }}
  WEBHOOK_WORKER_BACKOFF_MS: {{ .Values.config.webhookWorkerBackoffMs | default 500 | quote }}
  GRAPHQL_MAX_DEPTH: {{ .Values.config.graphqlMaxDepth | default 7 | quote }}
  GRAPHQL_MAX_COMPLEXITY: {{ .Values.config.graphqlMaxComplexity | default 200 | quote }}
  GRAPHQL_DEFAULT_LIMIT: {{ .Values.config.graphqlDefaultLimit | default 100 | quote }}
  GRAPHQL_MAX_LIMIT: {{ .Values.config.graphqlMaxLimit | default 1000 | quote }}
  GRAPHQL_QUERY_TIMEOUT_SECS: {{ .Values.config.graphqlQueryTimeoutSecs | default 5 | quote }}
  {{- if .Values.config.startBlock }}
  START_BLOCK: {{ .Values.config.startBlock | quote }}
  {{- end }}
  CHUNK_SIZE: {{ .Values.config.chunkSize | default 10 | quote }}
  {{- if .Values.config.cuBudget }}
  CU_BUDGET: {{ .Values.config.cuBudget | quote }}
  {{- end }}
  {{- if .Values.config.bulkStreamUrl }}
  BULK_STREAM_URL: {{ .Values.config.bulkStreamUrl | quote }}
  {{- end }}
  {{- if .Values.config.webhookUrl }}
  WEBHOOK_URL: {{ .Values.config.webhookUrl | quote }}
  {{- end }}
  {{- if or .Values.config.manifestPath .Values.config.manifestContent }}
  MANIFEST_PATH: {{ default "/etc/logrix/manifest.yaml" .Values.config.manifestPath | quote }}
  {{- end }}
  {{- if or .Values.config.schemaPath .Values.config.schemaContent }}
  SCHEMA_PATH: {{ default "/etc/logrix/schema.graphql" .Values.config.schemaPath | quote }}
  {{- end }}
  {{- if .Values.config.manifestContent }}
  manifest.yaml: |
{{ .Values.config.manifestContent | indent 4 }}
  {{- end }}
  {{- if .Values.config.schemaContent }}
  schema.graphql: |
{{ .Values.config.schemaContent | indent 4 }}
  {{- end }}
