apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logrix.fullname" . }}-config
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
data:
  CHAIN_ID: {{ .Values.config.chainId | quote }}
  CONTRACT_ADDRESS: {{ .Values.config.contractAddress | quote }}
  RPC_URL: {{ .Values.config.rpcUrl | quote }}
  RPC_FALLBACK_URLS: {{ .Values.config.rpcFallbackUrls | quote }}
  QUEUE_DRIVER: {{ .Values.config.queueDriver | quote }}
  RABBITMQ_URL: {{ .Values.config.rabbitmqUrl | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  RECONCILER_INTERVAL_SECS: {{ .Values.config.reconcilerIntervalSecs | quote }}
  RING_BUFFER_DEPTH: {{ .Values.config.ringBufferDepth | quote }}
  {{- if .Values.config.startBlock }}
  START_BLOCK: {{ .Values.config.startBlock | quote }}
  {{- end }}
  {{- if .Values.config.cuBudget }}
  CU_BUDGET: {{ .Values.config.cuBudget | quote }}
  {{- end }}
  {{- if .Values.config.bulkStreamUrl }}
  BULK_STREAM_URL: {{ .Values.config.bulkStreamUrl | quote }}
  {{- end }}
  {{- if .Values.config.webhookUrl }}
  WEBHOOK_URL: {{ .Values.config.webhookUrl | quote }}
  {{- end }}
  {{- if or .Values.config.manifestPath .Values.config.manifestContent }}
  MANIFEST_PATH: {{ default "/etc/logrix/manifest.yaml" .Values.config.manifestPath | quote }}
  {{- end }}
  {{- if or .Values.config.schemaPath .Values.config.schemaContent }}
  SCHEMA_PATH: {{ default "/etc/logrix/schema.graphql" .Values.config.schemaPath | quote }}
  {{- end }}
  {{- if .Values.config.manifestContent }}
  manifest.yaml: |
{{ .Values.config.manifestContent | indent 4 }}
  {{- end }}
  {{- if .Values.config.schemaContent }}
  schema.graphql: |
{{ .Values.config.schemaContent | indent 4 }}
  {{- end }}

