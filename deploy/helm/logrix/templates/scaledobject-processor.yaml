{{- if and .Values.processor.enabled .Values.processor.keda.enabled }}
{{- $sqsQueueURL := default .Values.config.sqsLiveUrl .Values.processor.keda.sqs.queueUrl }}
{{- $sqsBackfillURL := default .Values.config.sqsBackfillUrl .Values.processor.keda.sqs.backfillQueueUrl }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "logrix.fullname" . }}-processor-autoscaler
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "logrix.fullname" . }}-processor
  pollingInterval: {{ .Values.processor.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.processor.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.processor.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.processor.keda.maxReplicaCount | default 50 }}
  triggers:
    {{- if or (eq .Values.processor.keda.queueType "sqs") (eq .Values.config.queueDriver "sqs") }}
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ required "processor.keda.sqs.queueUrl or config.sqsLiveUrl is required for SQS scaling" $sqsQueueURL | quote }}
        queueLength: {{ .Values.processor.keda.targetQueueDepth | default 30 | quote }}
        awsRegion: {{ default .Values.config.awsRegion .Values.processor.keda.sqs.awsRegion | default "us-east-1" | quote }}
      {{- if .Values.processor.keda.triggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.processorSqsTriggerAuthenticationName" . }}
      {{- end }}
    {{- if $sqsBackfillURL }}
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ $sqsBackfillURL | quote }}
        queueLength: {{ .Values.processor.keda.targetBackfillQueueDepth | default 50 | quote }}
        awsRegion: {{ default .Values.config.awsRegion .Values.processor.keda.sqs.awsRegion | default "us-east-1" | quote }}
      {{- if .Values.processor.keda.triggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.processorSqsTriggerAuthenticationName" . }}
      {{- end }}
    {{- end }}
    {{- else }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: {{ .Values.processor.keda.rabbitmq.queueName | default "logrix.live.jobs" | quote }}
        mode: QueueLength
        value: {{ .Values.processor.keda.targetQueueDepth | default 30 | quote }}
        {{- if .Values.processor.keda.rabbitmqTriggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.processorRabbitmqTriggerAuthenticationName" . }}
        {{- else }}
        host: {{ required "processor.keda.rabbitmq.host or config.rabbitmqUrl is required when RabbitMQ TriggerAuthentication is disabled" (default .Values.config.rabbitmqUrl .Values.processor.keda.rabbitmq.host) | quote }}
        {{- end }}
    {{- if .Values.processor.keda.rabbitmq.backfillQueueName }}
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: {{ .Values.processor.keda.rabbitmq.backfillQueueName | quote }}
        mode: QueueLength
        value: {{ .Values.processor.keda.targetBackfillQueueDepth | default 50 | quote }}
        {{- if .Values.processor.keda.rabbitmqTriggerAuthentication.enabled }}
      authenticationRef:
        name: {{ include "logrix.processorRabbitmqTriggerAuthenticationName" . }}
        {{- else }}
        host: {{ required "processor.keda.rabbitmq.host or config.rabbitmqUrl is required when RabbitMQ TriggerAuthentication is disabled" (default .Values.config.rabbitmqUrl .Values.processor.keda.rabbitmq.host) | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
