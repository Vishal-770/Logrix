{{- if .Values.localDev.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logrix.fullname" . }}-rabbitmq
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: local-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logrix.name" . }}-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logrix.name" . }}-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "logrix"
            - name: RABBITMQ_DEFAULT_PASS
              value: "logrixpassword"
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logrix.fullname" . }}-rabbitmq
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  selector:
    app.kubernetes.io/name: {{ include "logrix.name" . }}-rabbitmq
{{- end }}
