{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logrix.serviceAccountName" . }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.ingester.serviceAccount .Values.ingester.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ingester.serviceAccount.name }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
  {{- with .Values.ingester.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.processor.serviceAccount .Values.processor.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.processor.serviceAccount.name }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
  {{- with .Values.processor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.api.serviceAccount .Values.api.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.webhook.serviceAccount .Values.webhook.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.webhook.serviceAccount.name }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- with .Values.webhook.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "logrix.fullname" . }}-lease-role
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "logrix.fullname" . }}-lease-binding
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "logrix.ingesterServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "logrix.fullname" . }}-lease-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
