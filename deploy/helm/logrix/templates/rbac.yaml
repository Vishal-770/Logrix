{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logrix.serviceAccountName" . }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.serviceAccount.create .Values.rbac.create }}
---
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "logrix.fullname" . }}-lease-role
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "logrix.fullname" . }}-lease-binding
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "logrix.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "logrix.fullname" . }}-lease-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
