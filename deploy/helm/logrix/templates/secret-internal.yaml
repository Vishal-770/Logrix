{{- if or (not .Values.config.existingSecret) .Values.builtIn.enabled .Values.config.webhookSecret }}
{{- if and (not .Values.config.existingSecret) (not .Values.builtIn.enabled) (not (and .Values.localDev .Values.localDev.enabled)) }}
{{- fail "config.existingSecret is required when builtIn services are disabled" }}
{{- end }}
{{- if and (not .Values.config.existingSecret) (not (and .Values.localDev .Values.localDev.enabled)) (not .Values.builtIn.postgres) (empty .Values.config.databaseUrl) }}
{{- fail "config.databaseUrl is required when built-in PostgreSQL is disabled" }}
{{- end }}
{{- if and (not .Values.config.existingSecret) (not (and .Values.localDev .Values.localDev.enabled)) (eq .Values.config.queueDriver "rabbitmq") (not .Values.builtIn.rabbitmq) (empty .Values.config.rabbitmqUrl) }}
{{- fail "config.rabbitmqUrl is required when built-in RabbitMQ is disabled" }}
{{- end }}
{{- if and (or .Values.webhook.enabled .Values.processor.webhookWorker.enabled) (not .Values.config.existingSecret) (empty .Values.config.webhookSecret) }}
{{- fail "config.webhookSecret is required when webhook delivery is enabled without config.existingSecret" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "logrix.internalSecretName" .) -}}
{{- $pgAuth := .Values.builtIn.postgresPassword -}}
{{- if empty $pgAuth }}
  {{- if and $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
    {{- $pgAuth = (index $existing.data "POSTGRES_PASSWORD" | b64dec) }}
  {{- else }}
    {{- $pgAuth = (randAlphaNum 32) }}
  {{- end }}
{{- end }}
{{- $rmqAuth := .Values.builtIn.rabbitmqPassword -}}
{{- if empty $rmqAuth }}
  {{- if and $existing (hasKey $existing.data "RABBITMQ_DEFAULT_PASS") }}
    {{- $rmqAuth = (index $existing.data "RABBITMQ_DEFAULT_PASS" | b64dec) }}
  {{- else }}
    {{- $rmqAuth = (randAlphaNum 32) }}
  {{- end }}
{{- end }}
{{- $minioAuth := .Values.builtIn.minioRootPassword -}}
{{- if empty $minioAuth }}
  {{- if and $existing (hasKey $existing.data "MINIO_ROOT_PASSWORD") }}
    {{- $minioAuth = (index $existing.data "MINIO_ROOT_PASSWORD" | b64dec) }}
  {{- else }}
    {{- $minioAuth = (randAlphaNum 32) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logrix.internalSecretName" . }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.config.existingSecret }}
  DATABASE_URL: {{ default (printf "postgres://logrix:%s@%s-postgres:5432/logrix" (urlquery $pgAuth) (include "logrix.fullname" .)) .Values.config.databaseUrl | quote }}
  RABBITMQ_URL: {{ default (printf "amqp://logrix:%s@%s-rabbitmq:5672/%%2f" (urlquery $rmqAuth) (include "logrix.fullname" .)) .Values.config.rabbitmqUrl | quote }}
  {{- end }}
  {{- if .Values.config.webhookSecret }}
  WEBHOOK_SECRET: {{ .Values.config.webhookSecret | quote }}
  {{- end }}
  {{- if or (and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.postgres) (and .Values.localDev .Values.localDev.enabled) }}
  POSTGRES_USER: "logrix"
  POSTGRES_PASSWORD: {{ $pgAuth | quote }}
  POSTGRES_DB: "logrix"
  {{- end }}
  {{- if or (and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.rabbitmq) (and .Values.localDev .Values.localDev.enabled) }}
  RABBITMQ_DEFAULT_USER: "logrix"
  RABBITMQ_DEFAULT_PASS: {{ $rmqAuth | quote }}
  RABBITMQ_DEFAULT_VHOST: "/"
  {{- end }}
  {{- if and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.minio }}
  MINIO_ROOT_USER: {{ default "logrix" .Values.builtIn.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioAuth | quote }}
  AWS_ACCESS_KEY_ID: {{ default "logrix" .Values.builtIn.minioRootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $minioAuth | quote }}
  {{- end }}
{{- end }}
