{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "logrix.fullname" . }}
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "logrix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic to API from within cluster or ingress controller
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port | default 4000 }}
    # Allow metrics scraping
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow outbound traffic to EVM RPC nodes, AWS APIs, and DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 9000
{{- end }}
