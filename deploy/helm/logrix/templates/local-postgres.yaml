{{- if .Values.localDev.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logrix.fullname" . }}-postgres
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logrix.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logrix.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "logrix"
            - name: POSTGRES_PASSWORD
              value: "logrixpassword"
            - name: POSTGRES_DB
              value: "logrix"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logrix.fullname" . }}-postgres
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "logrix.name" . }}-postgres
{{- end }}
