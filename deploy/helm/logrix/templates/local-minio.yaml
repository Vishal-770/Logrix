{{- if and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.minio (empty .Values.config.s3Endpoint) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "logrix.fullname" . }}-minio
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: local-minio
spec:
  serviceName: {{ include "logrix.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-03-30T09-41-56Z
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "logrix.internalSecretName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "logrix.internalSecretName" . }}
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: minio-data
              mountPath: /data
      {{- if not .Values.builtIn.persistence.enabled }}
      volumes:
        - name: minio-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.builtIn.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.builtIn.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.builtIn.minioStorage }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logrix.fullname" . }}-minio
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
{{- end }}
