{{- if and .Values.builtIn .Values.builtIn.enabled .Values.builtIn.minio (empty .Values.config.s3Endpoint) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logrix.fullname" . }}-minio
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: local-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-03-30T09-41-56Z
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "logrix"
            - name: MINIO_ROOT_PASSWORD
              value: "logrixpassword"
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logrix.fullname" . }}-minio
  labels:
    {{- include "logrix.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app.kubernetes.io/name: {{ include "logrix.name" . }}-minio
{{- end }}
