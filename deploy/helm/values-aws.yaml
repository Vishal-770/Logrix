# Mode 2: Production AWS EKS Profile
# Provisions on AWS Aurora Serverless v2 PostgreSQL, Amazon SQS, and Amazon S3

image:
  repository: ghcr.io/vishal-770/logrix
  tag: "0.8.0"
  pullPolicy: IfNotPresent

# Disable built-in self-hosted containers (AWS provides Aurora, SQS, and S3)
builtIn:
  enabled: false
  postgres: false
  rabbitmq: false
  minio: false

localDev:
  enabled: false

config:
  chainId: 42161
  contractAddress: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
  rpcUrl: "https://arb1.arbitrum.io/rpc"
  queueDriver: "sqs"
  awsRegion: "us-east-1"
  reconcilerIntervalSecs: 30
  ringBufferDepth: 256
  # Production DB credentials injected from Kubernetes Secret (managed by AWS Secrets Manager or External Secrets)
  existingSecret: "logrix-secrets"

  # AWS SQS Queue URLs for cloud worker scaling
  sqsLiveUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/logrix-live-jobs"
  sqsBackfillUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/logrix-backfill-jobs"
  sqsWebhookUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/logrix-webhook-jobs"
  sqsDlqUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/logrix-dead-letter-jobs"
  sqsEndpoint: ""

  # Optional S3 block archive bucket (populate with s3_bucket_name from Terraform outputs, or leave empty if not archiving)
  s3Bucket: ""

  # Base64 encoded WebAssembly binary (Method 2: Zero-dependency custom TypeScript logic)
  # Populate with: cat handlers/mapping.wasm | base64 -w 0
  wasmBase64: ""

  manifestContent: |
    version: "0.1.0"
    network:
      chain_id: 42161
      rpc_url: "https://arb1.arbitrum.io/rpc"
    contracts:
      - name: "USDCToken"
        address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
        start_block: 220000000
        wasm_handler: "/etc/logrix/handlers/mapping.wasm"
        events:
          - name: "Transfer"
            signature: "Transfer(address,address,uint256)"

  schemaContent: |
    type Transfer @entity {
      id: ID!
      blockNumber: BigInt!
      fromAddress: String! @index
      toAddress: String! @index
      amount: BigInt!
      transactionHash: String!
      timestamp: BigInt!
    }

serviceAccount:
  create: true
  name: "logrix-sa"
  annotations:
    # Fallback role for workloads that do not use a dedicated ServiceAccount.
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/logrix-production-processor-irsa"
    eks.amazonaws.com/sts-regional-endpoints: "true"

ingester:
  replicas: 2
  serviceAccount:
    create: true
    name: "logrix-ingester"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/logrix-production-ingester-irsa"
      eks.amazonaws.com/sts-regional-endpoints: "true"
  leaderElection:
    enabled: true
    leaseName: "logrix-ingester-lease"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

processor:
  replicas: 2
  serviceAccount:
    create: true
    name: "logrix-processor"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/logrix-production-processor-irsa"
      eks.amazonaws.com/sts-regional-endpoints: "true"
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 50
    queueType: sqs
    targetQueueDepth: 100
    sqs:
      queueUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/logrix-live-jobs"
      awsRegion: "us-east-1"
    triggerAuthentication:
      enabled: true
      podIdentityProvider: "aws"
      identityOwner: "workload"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

api:
  replicas: 2
  serviceAccount:
    create: true
    name: "logrix-api"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/logrix-production-api-irsa"
      eks.amazonaws.com/sts-regional-endpoints: "true"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 4000

webhook:
  serviceAccount:
    create: true
    name: "logrix-webhook"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/logrix-production-webhook-irsa"
      eks.amazonaws.com/sts-regional-endpoints: "true"

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
