apiVersion: v1
kind: ConfigMap
metadata:
  name: logrix-config
  namespace: logrix-dev
  labels:
    app.kubernetes.io/name: logrix
data:
  CHAIN_ID: "421614"
  RPC_URL: "https://sepolia-rollup.arbitrum.io/rpc"
  CONTRACT_ADDRESS: "0x75faf114eafb1BDbe2F0316DF893fd58CE46AA4d"
  DATABASE_URL: "postgres://logrix:logrix@postgres.logrix-dev.svc.cluster.local:5432/logrix"
  RABBITMQ_URL: "amqp://logrix:logrix@rabbitmq.logrix-dev.svc.cluster.local:5672/%2f"
  PORT: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: logrix-api
  namespace: logrix-dev
  labels:
    app.kubernetes.io/name: logrix-api
    app.kubernetes.io/part-of: logrix
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: graphql
  selector:
    app.kubernetes.io/name: logrix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logrix
  namespace: logrix-dev
  labels:
    app.kubernetes.io/name: logrix
    app.kubernetes.io/part-of: logrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logrix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logrix
    spec:
      containers:
        - name: logrix
          image: logrix:latest
          imagePullPolicy: IfNotPresent
          command: ["logrix", "all-in-one"]
          envFrom:
            - configMapRef:
                name: logrix-config
          ports:
            - containerPort: 4000
              name: graphql
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
