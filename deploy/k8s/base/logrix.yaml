apiVersion: v1
kind: Service
metadata:
  name: logrix-api
  labels:
    app.kubernetes.io/name: logrix-api
    app.kubernetes.io/part-of: logrix
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      name: graphql
  selector:
    app.kubernetes.io/name: logrix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logrix
  labels:
    app.kubernetes.io/name: logrix
    app.kubernetes.io/part-of: logrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logrix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logrix
    spec:
      containers:
        - name: logrix
          image: ghcr.io/vishal-770/logrix:latest
          imagePullPolicy: IfNotPresent
          command: ["logrix", "all-in-one"]
          envFrom:
            - configMapRef:
                name: logrix-config
            - secretRef:
                name: logrix-secrets
          ports:
            - containerPort: 4000
              name: graphql
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
