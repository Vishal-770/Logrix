config:
  chainId: 1
  rpcUrl: https://eth.llamarpc.com
  rpcFallbackUrls: https://rpc.payload.de,https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
  contractAddress: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
  startBlock: "16291127"
  reconcilerIntervalSecs: 30
  ringBufferDepth: 128
  manifestContent: |
    schema_version: "1"
    chain_id: 1
    contracts:
      - name: Pool
        address: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
        start_block: 16291127
        events:
          - Supply
          - Withdraw
          - Borrow
          - Repay
          - LiquidationCall
          - FlashLoan
        wasm_handler: /etc/logrix/handlers/mapping.wasm
  schemaContent: |
    type Protocol @entity {
      id: ID!
      totalSuppliedCount: BigInt!
      totalBorrowedCount: BigInt!
      totalLiquidatedCount: BigInt!
      totalFlashLoansCount: BigInt!
    }

    type User @entity {
      id: ID!
      address: String!
      supplyCount: BigInt!
      borrowCount: BigInt!
      liquidationCount: BigInt!
    }

    type Reserve @entity {
      id: ID!
      assetAddress: String!
      totalSupplied: BigInt!
      totalBorrowed: BigInt!
      totalLiquidated: BigInt!
    }

    type SupplyAction @entity {
      id: ID!
      reserve: String!
      user: String!
      onBehalfOf: String!
      amount: BigInt!
      referralCode: Int!
      blockNumber: BigInt!
      blockTimestamp: BigInt!
      transactionHash: String!
    }

    type BorrowAction @entity {
      id: ID!
      reserve: String!
      user: String!
      onBehalfOf: String!
      amount: BigInt!
      interestRateMode: Int!
      borrowRate: BigInt!
      blockNumber: BigInt!
      blockTimestamp: BigInt!
      transactionHash: String!
    }

    type LiquidationAction @entity {
      id: ID!
      collateralAsset: String!
      debtAsset: String!
      user: String!
      debtToCover: BigInt!
      liquidatedCollateralAmount: BigInt!
      liquidator: String!
      receiveAToken: Boolean!
      blockNumber: BigInt!
      blockTimestamp: BigInt!
      transactionHash: String!
    }

    type FlashLoanAction @entity {
      id: ID!
      target: String!
      initiator: String!
      asset: String!
      amount: BigInt!
      premium: BigInt!
      blockNumber: BigInt!
      blockTimestamp: BigInt!
      transactionHash: String!
    }
  wasmBase64: 
  existingSecret: logrix-secrets
  chunkSize: 50
  chainHeadPollMs: 1000
  maxQueueDepth: 5000
